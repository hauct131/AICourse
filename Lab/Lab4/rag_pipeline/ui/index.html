<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Local — Chat</title>
<style>
  :root { --bg:#0e1118; --card:#131720; --border:#1c2236; --accent:#4f8ef7; --green:#2dd4a0; --text:#dde3f0; --muted:#5a6580; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { font-size:1rem; margin:0; font-weight:700; }
  header .up { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  input[type=file] { color:var(--muted); font-size:12px; max-width:220px; }
  button { background:var(--accent); color:#0e1118; border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:860px; width:100%; margin:0 auto; }
  .msg { margin:14px 0; display:flex; gap:10px; }
  .msg .who { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); min-width:54px; padding-top:9px; }
  .bubble { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; line-height:1.6; white-space:pre-wrap; }
  .msg.me .bubble { background:rgba(79,142,247,.1); border-color:rgba(79,142,247,.35); }
  .sources { margin-top:8px; font-size:11px; color:var(--green); font-family:"JetBrains Mono",monospace; }
  .composer { border-top:1px solid var(--border); padding:14px 20px; display:flex; gap:10px; max-width:860px; width:100%; margin:0 auto; }
  .composer textarea { flex:1; resize:none; height:44px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:11px 14px; font-size:14px; font-family:inherit; }
  .hint { font-size:11px; color:var(--muted); text-align:center; padding:6px; }
</style>
</head>
<body>
  <header>
    <h1>🔎 RAG Local — Chat trên tài liệu của bạn</h1>
    <div class="up">
      <input type="file" id="file" accept=".md,.txt" />
      <button id="uploadBtn" onclick="upload()">Upload &amp; Index</button>
    </div>
  </header>

  <div id="log">
    <div class="msg"><div class="who">RAG</div><div class="bubble">Chào bạn! Upload một file .md để nạp, rồi hỏi tôi bất cứ điều gì trong tài liệu.</div></div>
  </div>

  <div class="composer">
    <textarea id="q" placeholder="Hỏi một câu... (Enter để gửi)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()">Gửi</button>
  </div>
  <div class="hint">Backend: POST /chat · POST /upload — chạy cùng origin với giao diện</div>

<script>
  const API = "";  // cùng origin — backend phục vụ trang này tại http://localhost:8000
  const log = document.getElementById("log");

  function add(who, text, sources) {
    const wrap = document.createElement("div");
    wrap.className = "msg" + (who === "Bạn" ? " me" : "");
    let inner = `<div class="who">${who}</div><div class="bubble">${escapeHtml(text)}`;
    if (sources && sources.length) inner += `<div class="sources">📄 ${sources.join(", ")}</div>`;
    inner += `</div>`;
    wrap.innerHTML = inner;
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }
  function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  async function send() {
    const q = document.getElementById("q");
    const question = q.value.trim();
    if (!question) return;
    q.value = "";
    add("Bạn", question);
    const btn = document.getElementById("sendBtn"); btn.disabled = true;
    const thinking = add("RAG", "đang tìm & trả lời...");
    try {
      const r = await fetch(API + "/chat", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ question })
      });
      const data = await r.json();
      thinking.remove();
      add("RAG", data.answer || "(không có câu trả lời)", data.sources);
    } catch (e) {
      thinking.remove();
      add("RAG", "Lỗi gọi /chat: " + e.message);
    } finally { btn.disabled = false; }
  }

  async function upload() {
    const f = document.getElementById("file").files[0];
    if (!f) { alert("Chọn một file .md trước"); return; }
    const btn = document.getElementById("uploadBtn"); btn.disabled = true;
    add("Bạn", "⬆️ Upload: " + f.name);
    const fd = new FormData(); fd.append("file", f);
    try {
      const r = await fetch(API + "/upload", { method: "POST", body: fd });
      const data = await r.json();
      add("RAG", `Đã nạp "${f.name}" — ${data.chunks_indexed ?? "?"} chunk đã index.`);
    } catch (e) {
      add("RAG", "Lỗi gọi /upload: " + e.message);
    } finally { btn.disabled = false; }
  }
</script>
</body>
</html>
