version: '3.8'

services:
  gemini-playground:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-playground-app
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-openai/gpt-oss-120b:free}
    # Mount code for local hot-reloading development (optional, disabled by default in production)
    # volumes:
    #   - ./app:/app/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
